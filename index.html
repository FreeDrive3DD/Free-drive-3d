
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hill Drive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">BUILDING YOUR WORLD...</div>

  <div id="hud">
    <div class="brand">HILL<span>DRIVE</span></div>
    <div class="speed-box">
      <div class="speed-line">
        <span id="speed">0</span>
        <small>MPH</small>
      </div>
      <div class="limit">SPEED LIMIT <b>250 MPH</b></div>
    </div>
    <div id="hint">WASD / ARROWS TO DRIVE</div>
  </div>

  <div id="touch-controls">
    <div class="steering">
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>
    <div class="pedals">
      <button id="brake" class="brake">BRAKE</button>
      <button id="accelerate" class="accelerate">GO</button>
    </div>
  </div>

  <div id="help">
    W / ↑ Accelerate | S / ↓ Brake |
    A / D Steer | Space Handbrake
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
