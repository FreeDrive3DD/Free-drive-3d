<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Drive 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="speedo">
      <div id="speed">0</div>
      <div id="unit">mph</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="limit">Limit 250 mph</div>
    </div>
    <div id="hint">C camera &nbsp; R reset &nbsp; Space handbrake</div>
  </div>

  <div id="start">
    <h1>Open Road</h1>
    <p>Drive anywhere. The road never ends, and neither do the hills.</p>
    <p class="keys">W / Up accelerate &nbsp; S / Down brake &nbsp; A D / Left Right steer</p>
    <p class="go">Press any key to drive</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
